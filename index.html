<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تست ریاضی نهم</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;700;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Vazirmatn', sans-serif; }
  html { scroll-behavior: smooth; }
  body { background: #050505; color: #fff; overflow-x: hidden; min-height: 100vh; line-height: 1.9; }
  
  /* ===== پس‌زمینه ===== */
  .bg-glow { position: fixed; top: -50%; left: -50%; width: 200%; height: 200%;
    background: radial-gradient(circle at 20% 30%, rgba(212,175,55,0.1) 0%, transparent 45%),
                radial-gradient(circle at 80% 70%, rgba(212,175,55,0.07) 0%, transparent 45%),
                radial-gradient(circle at 50% 50%, rgba(255,215,0,0.03) 0%, transparent 60%);
    z-index: 0; pointer-events: none; animation: rotateGlow 40s linear infinite; }
  @keyframes rotateGlow { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  
  /* ===== ذرات طلایی ===== */
  .particles { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  .particle { position: absolute; width: 2px; height: 2px; background: #d4af37; border-radius: 50%;
    box-shadow: 0 0 8px #d4af37, 0 0 16px rgba(212,175,55,0.6); animation: floatParticle linear infinite; }
  @keyframes floatParticle {
    0% { transform: translateY(100vh) scale(0); opacity: 0; }
    10% { opacity: 1; } 90% { opacity: 1; }
    100% { transform: translateY(-100px) scale(1); opacity: 0; } }
  
  /* ===== اعداد ریاضی سه‌بعدی ===== */
  .math-symbols { position: fixed; inset: 0; z-index: 1; pointer-events: none; overflow: hidden;
    perspective: 1000px; }
  .math-symbol {
    position: absolute;
    font-size: 3rem;
    font-weight: 900;
    color: rgba(212, 175, 55, 0.18);
    text-shadow: 0 0 20px rgba(212, 175, 55, 0.4),
                 0 0 40px rgba(212, 175, 55, 0.2);
    animation: float3D linear infinite;
    transform-style: preserve-3d;
  }
  @keyframes float3D {
    0% {
      transform: translateY(100vh) translateZ(-200px) rotateX(0deg) rotateY(0deg) rotateZ(0deg) scale(0.5);
      opacity: 0;
    }
    10% { opacity: 0.9; }
    50% {
      transform: translateY(50vh) translateZ(100px) rotateX(180deg) rotateY(180deg) rotateZ(90deg) scale(1.2);
    }
    90% { opacity: 0.9; }
    100% {
      transform: translateY(-100px) translateZ(400px) rotateX(360deg) rotateY(360deg) rotateZ(180deg) scale(0.5);
      opacity: 0;
    }
  }
  
  .container { max-width: 1000px; margin: 0 auto; padding: 0 25px; position: relative; z-index: 2; }
  
  /* ===== منو ===== */
  .navbar { position: fixed; top: 0; left: 0; right: 0; padding: 18px 25px;
    background: rgba(5,5,5,0.7); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
    border-bottom: 1px solid rgba(212,175,55,0.15); z-index: 100;
    box-shadow: 0 4px 30px rgba(212,175,55,0.05); }
  .nav-content { max-width: 1000px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
  .logo { font-size: 1.5rem; font-weight: 900;
    background: linear-gradient(135deg, #d4af37, #f4d03f, #ffd700);
    background-size: 200% 200%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent; background-clip: text; letter-spacing: 1px;
    animation: logoShine 3s ease infinite; }
  @keyframes logoShine {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }
  .nav-links { display: flex; gap: 25px; list-style: none; }
  .nav-links a { color: #999; text-decoration: none; font-size: 0.9rem; transition: all 0.3s; position: relative; }
  .nav-links a::after { content: ''; position: absolute; bottom: -5px; right: 0; width: 0; height: 1px;
    background: linear-gradient(90deg, transparent, #d4af37, transparent); transition: width 0.4s; }
  .nav-links a:hover { color: #d4af37; text-shadow: 0 0 15px rgba(212,175,55,0.5); }
  .nav-links a:hover::after { width: 100%; }
  
  /* ===== صفحه‌ها ===== */
  .screen { display: none; padding: 120px 0 60px; min-height: 100vh; position: relative; z-index: 2; }
  .screen.active { display: block; animation: fadeIn 0.6s cubic-bezier(0.4, 0, 0.2, 1); }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
  
  /* ===== تیتر ===== */
  .hero-title { font-size: 3.8rem; font-weight: 900;
    background: linear-gradient(135deg, #ffffff 0%, #d4af37 40%, #ffd700 60%, #d4af37 100%);
    background-size: 200% 200%;
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    margin-bottom: 15px; letter-spacing: -1px; text-align: center;
    animation: titleGlow 4s ease infinite;
    filter: drop-shadow(0 0 30px rgba(212,175,55,0.3)); }
  @keyframes titleGlow {
    0%, 100% { background-position: 0% 50%; filter: drop-shadow(0 0 30px rgba(212,175,55,0.3)); }
    50% { background-position: 100% 50%; filter: drop-shadow(0 0 50px rgba(212,175,55,0.5)); }
  }
  .hero-sub { text-align: center; color: #888; font-size: 1.1rem; margin-bottom: 50px; letter-spacing: 1px; }
  
  /* ===== آمار ===== */
  .stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 50px; }
  .stat-card { text-align: center; padding: 30px 20px;
    background: linear-gradient(135deg, rgba(255,255,255,0.03), rgba(212,175,55,0.02));
    border: 1px solid rgba(212,175,55,0.15); border-radius: 20px;
    backdrop-filter: blur(20px); position: relative; overflow: hidden;
    transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
  .stat-card::before { content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(212,175,55,0.1), transparent);
    transition: left 0.6s; }
  .stat-card:hover::before { left: 100%; }
  .stat-card:hover { transform: translateY(-5px); border-color: rgba(212,175,55,0.4);
    box-shadow: 0 20px 50px rgba(212,175,55,0.15); }
  .stat-num { font-size: 2.2rem; font-weight: 900;
    background: linear-gradient(135deg, #d4af37, #f4d03f, #ffd700);
    background-size: 200% 200%;
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    display: block; animation: numShine 3s ease infinite; }
  @keyframes numShine {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }
  .stat-lbl { color: #888; font-size: 0.85rem; margin-top: 5px; }
  
  /* ===== عنوان بخش ===== */
  .section-label { display: inline-block; color: #d4af37; font-size: 0.8rem;
    font-weight: 700; letter-spacing: 4px; margin-bottom: 15px;
    position: relative; padding-right: 20px; }
  .section-label::before { content: ''; position: absolute; right: 0; top: 50%; width: 12px; height: 1px;
    background: linear-gradient(90deg, #d4af37, transparent); }
  .section-title { font-size: 1.8rem; font-weight: 900; color: #fff; margin-bottom: 30px;
    text-shadow: 0 0 30px rgba(212,175,55,0.2); }
  
  /* ===== کارت فصل ===== */
  .chapters-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 18px; margin-bottom: 40px; perspective: 1000px; }
  .chapter-card { background: linear-gradient(135deg, rgba(255,255,255,0.03), rgba(212,175,55,0.02));
    border: 1px solid rgba(212,175,55,0.15);
    border-radius: 20px; padding: 25px; cursor: pointer;
    transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1); position: relative; overflow: hidden;
    backdrop-filter: blur(20px); transform-style: preserve-3d; }
  .chapter-card::before { content: ''; position: absolute; top: 0; right: 0; width: 100%; height: 2px;
    background: linear-gradient(90deg, transparent, #d4af37, #ffd700, #d4af37, transparent);
    transform: translateX(-100%); transition: transform 0.8s ease; }
  .chapter-card::after { content: ''; position: absolute; inset: 0;
    background: radial-gradient(circle at 50% 0%, rgba(212,175,55,0.15), transparent 70%);
    opacity: 0; transition: opacity 0.5s; pointer-events: none; }
  .chapter-card:hover::before { transform: translateX(100%); }
  .chapter-card:hover::after { opacity: 1; }
  .chapter-card:hover { border-color: rgba(212,175,55,0.5); transform: translateY(-8px) rotateX(5deg) rotateY(-3deg);
    background: linear-gradient(135deg, rgba(255,255,255,0.05), rgba(212,175,55,0.03));
    box-shadow: 0 25px 60px rgba(212,175,55,0.2); }
  .chapter-num { font-size: 0.85rem; color: #d4af37; font-weight: 700;
    letter-spacing: 2px; margin-bottom: 10px; text-shadow: 0 0 10px rgba(212,175,55,0.4); }
  .chapter-name { font-size: 1.2rem; font-weight: 700; color: #fff; margin-bottom: 12px; }
  .chapter-info { display: flex; justify-content: space-between; font-size: 0.85rem; color: #777; }
  .chapter-info .q-count { color: #d4af37; font-weight: 600; transition: all 0.3s; }
  .chapter-card:hover .q-count { text-shadow: 0 0 15px rgba(212,175,55,0.8); transform: translateX(-5px); }
  
  /* ===== دکمه‌ها ===== */
  .btn { display: inline-flex; align-items: center; gap: 10px; padding: 16px 35px;
    border-radius: 50px; font-size: 1rem; font-weight: 700; cursor: pointer;
    transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); border: none;
    font-family: 'Vazirmatn', sans-serif; text-decoration: none;
    position: relative; overflow: hidden; }
  .btn-primary { background: linear-gradient(135deg, #d4af37, #f4d03f, #ffd700);
    background-size: 200% 200%;
    color: #000; box-shadow: 0 10px 30px rgba(212,175,55,0.3);
    animation: btnShine 3s ease infinite; }
  @keyframes btnShine {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }
  .btn-primary::before { content: ''; position: absolute; top: 50%; left: 50%; width: 0; height: 0;
    background: rgba(255,255,255,0.4); border-radius: 50%; transform: translate(-50%, -50%);
    transition: width 0.6s, height 0.6s; }
  .btn-primary:hover::before { width: 400px; height: 400px; }
  .btn-primary:hover { transform: translateY(-3px); box-shadow: 0 20px 50px rgba(212,175,55,0.5); }
  .btn-secondary { background: rgba(255,255,255,0.03); color: #fff;
    border: 1px solid rgba(212,175,55,0.25); }
  .btn-secondary:hover { background: rgba(212,175,55,0.1); border-color: #d4af37;
    color: #d4af37; transform: translateY(-3px); box-shadow: 0 15px 40px rgba(212,175,55,0.2); }
  .btn-all { width: 100%; justify-content: center; margin-top: 20px; }
  
  /* ===== آزمون ===== */
  .quiz-header { display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 40px; flex-wrap: wrap; gap: 20px; }
  .quiz-info { display: flex; gap: 30px; align-items: center; }
  .quiz-info-item { display: flex; flex-direction: column; }
  .quiz-info-label { color: #777; font-size: 0.8rem; }
  .quiz-info-value { color: #d4af37; font-size: 1.2rem; font-weight: 900;
    text-shadow: 0 0 15px rgba(212,175,55,0.4); }
  .timer-box { display: flex; align-items: center; gap: 10px; padding: 12px 25px;
    background: rgba(255,255,255,0.03); border: 1px solid rgba(212,175,55,0.2);
    border-radius: 50px; font-weight: 900; font-size: 1.2rem; color: #d4af37;
    backdrop-filter: blur(10px); transition: all 0.3s;
    box-shadow: 0 0 20px rgba(212,175,55,0.1); }
  .timer-box.warning { color: #ff4444; border-color: rgba(255,68,68,0.4);
    box-shadow: 0 0 30px rgba(255,68,68,0.3); animation: timerPulse 1s infinite; }
  @keyframes timerPulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.05); }
  }
  
  .progress-wrap { height: 6px; background: rgba(255,255,255,0.05);
    border-radius: 10px; overflow: hidden; margin-bottom: 40px; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, #d4af37, #f4d03f, #ffd700);
    background-size: 200% 100%;
    border-radius: 10px; width: 0%;
    transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: 0 0 15px rgba(212,175,55,0.8), 0 0 30px rgba(212,175,55,0.4);
    animation: progressShine 2s linear infinite; }
  @keyframes progressShine {
    0% { background-position: 0% 50%; }
    100% { background-position: 200% 50%; }
  }
  
  .question-card { background: linear-gradient(135deg, rgba(255,255,255,0.03), rgba(212,175,55,0.02));
    border: 1px solid rgba(212,175,55,0.2); border-radius: 25px;
    padding: 45px; backdrop-filter: blur(25px); animation: slideUp 0.5s ease;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    position: relative; overflow: hidden; }
  .question-card::before { content: ''; position: absolute; top: 0; right: 0; width: 100%; height: 2px;
    background: linear-gradient(90deg, transparent, #d4af37, #ffd700, #d4af37, transparent); }
  @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
  
  .q-num { display: inline-block; padding: 6px 18px; background: rgba(212,175,55,0.1);
    border: 1px solid rgba(212,175,55,0.3); border-radius: 50px;
    font-size: 0.85rem; font-weight: 700; color: #d4af37; margin-bottom: 20px;
    box-shadow: 0 0 15px rgba(212,175,55,0.2); }
  .q-text { font-size: 1.4rem; font-weight: 700; color: #fff;
    line-height: 1.7; margin-bottom: 35px; }
  .options { display: grid; gap: 15px; }
  .option { display: flex; align-items: center; gap: 15px; padding: 20px 25px;
    background: linear-gradient(135deg, rgba(255,255,255,0.03), rgba(212,175,55,0.01));
    border: 2px solid rgba(212,175,55,0.1);
    border-radius: 15px; cursor: pointer; transition: all 0.3s ease;
    font-size: 1.05rem; font-weight: 600; color: #ddd; text-align: right;
    position: relative; overflow: hidden; }
  .option::before { content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(212,175,55,0.15), transparent);
    transition: left 0.6s; }
  .option:hover:not(.disabled)::before { left: 100%; }
  .option:hover:not(.disabled) { background: rgba(212,175,55,0.08);
    border-color: rgba(212,175,55,0.5); transform: translateX(-5px);
    box-shadow: 0 10px 30px rgba(212,175,55,0.15); }
  .option-letter { width: 35px; height: 35px; border-radius: 50%;
    background: rgba(212,175,55,0.1); border: 1px solid rgba(212,175,55,0.3);
    display: flex; align-items: center; justify-content: center;
    font-weight: 900; color: #d4af37; flex-shrink: 0; transition: all 0.3s; }
  .option:hover:not(.disabled) .option-letter { background: #d4af37; color: #000;
    box-shadow: 0 0 20px rgba(212,175,55,0.6); }
  .option.correct { background: rgba(34,197,94,0.15); border-color: #22c55e; color: #4ade80; }
  .option.correct .option-letter { background: #22c55e; color: #fff; border-color: #22c55e; }
  .option.wrong { background: rgba(239,68,68,0.15); border-color: #ef4444; color: #f87171; }
  .option.wrong .option-letter { background: #ef4444; color: #fff; border-color: #ef4444; }
  .option.disabled { cursor: not-allowed; opacity: 0.7; }
  
  .explain-box { margin-top: 25px; padding: 20px 25px;
    background: linear-gradient(135deg, rgba(212,175,55,0.08), rgba(212,175,55,0.03));
    border-right: 3px solid #d4af37;
    border-radius: 12px; color: #ccc; display: none; animation: fadeIn 0.4s ease; }
  .explain-box.show { display: block; }
  .explain-box strong { color: #d4af37; margin-left: 5px; }
  
  .next-wrap { margin-top: 30px; display: flex; justify-content: flex-start; }
  
  /* ===== نتیجه ===== */
  .result-card { text-align: center;
    background: linear-gradient(135deg, rgba(255,255,255,0.03), rgba(212,175,55,0.02));
    border: 1px solid rgba(212,175,55,0.2); border-radius: 25px;
    padding: 60px 40px; backdrop-filter: blur(25px); animation: slideUp 0.6s ease; }
  .result-emoji { font-size: 5rem; margin-bottom: 20px; display: block;
    animation: bounceIn 0.8s ease; filter: drop-shadow(0 0 30px rgba(212,175,55,0.5)); }
  @keyframes bounceIn {
    0% { transform: scale(0); } 60% { transform: scale(1.2); }
    100% { transform: scale(1); } }
  .result-title { font-size: 2.5rem; font-weight: 900;
    background: linear-gradient(135deg, #fff, #d4af37, #ffd700);
    background-size: 200% 200%;
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text; margin-bottom: 15px;
    animation: titleGlow 3s ease infinite; }
  .result-percent { font-size: 5rem; font-weight: 900;
    background: linear-gradient(135deg, #d4af37, #f4d03f, #ffd700);
    background-size: 200% 200%;
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text; display: block; line-height: 1; margin: 20px 0;
    animation: titleGlow 3s ease infinite; }
  .result-stats { display: grid; grid-template-columns: repeat(3, 1fr);
    gap: 20px; margin: 40px 0; }
  .result-stat { padding: 25px 15px;
    background: linear-gradient(135deg, rgba(255,255,255,0.03), rgba(212,175,55,0.02));
    border: 1px solid rgba(212,175,55,0.1); border-radius: 15px; }
  .result-stat-num { font-size: 2rem; font-weight: 900; display: block; margin-bottom: 5px; }
  .result-stat-num.green { color: #4ade80; text-shadow: 0 0 20px rgba(74,222,128,0.5); }
  .result-stat-num.red { color: #f87171; text-shadow: 0 0 20px rgba(248,113,113,0.5); }
  .result-stat-num.gold { color: #d4af37; text-shadow: 0 0 20px rgba(212,175,55,0.5); }
  .result-stat-lbl { color: #888; font-size: 0.85rem; }
  .result-buttons { display: flex; gap: 15px; justify-content: center;
    flex-wrap: wrap; margin-top: 30px; }
  
  /* ===== مرور ===== */
  .review-item { background: linear-gradient(135deg, rgba(255,255,255,0.02), rgba(239,68,68,0.02));
    border: 1px solid rgba(239,68,68,0.2); border-radius: 18px;
    padding: 25px; margin-bottom: 18px; border-right: 3px solid #ef4444; }
  .review-q { font-size: 1.1rem; font-weight: 700; color: #fff; margin-bottom: 15px; }
  .review-answer { display: flex; gap: 10px; align-items: center;
    font-size: 0.95rem; margin-bottom: 8px; }
  .review-answer .label { color: #888; min-width: 80px; }
  .review-answer .correct-val { color: #4ade80; font-weight: 700; }
  .review-answer .wrong-val { color: #f87171; font-weight: 700; text-decoration: line-through; }
  .no-mistakes { text-align: center; padding: 60px 30px;
    color: #4ade80; font-size: 1.3rem; font-weight: 700; }
  
  @media (max-width: 700px) {
    .nav-links { display: none; }
    .hero-title { font-size: 2.2rem; }
    .stats-row { grid-template-columns: 1fr; gap: 12px; }
    .stat-card { padding: 20px 15px; }
    .stat-num { font-size: 1.8rem; }
    .question-card { padding: 30px 22px; }
    .q-text { font-size: 1.15rem; }
    .option { padding: 15px 18px; font-size: 0.95rem; }
    .option-letter { width: 30px; height: 30px; font-size: 0.9rem; }
    .result-percent { font-size: 3.5rem; }
    .result-title { font-size: 1.8rem; }
    .result-stats { grid-template-columns: 1fr; gap: 12px; }
    .quiz-info { gap: 18px; }
    .quiz-info-value { font-size: 1rem; }
    .timer-box { padding: 10px 18px; font-size: 1rem; }
    .chapters-grid { grid-template-columns: 1fr; }
    .section-title { font-size: 1.4rem; }
    .math-symbol { font-size: 2rem; }
  }
</style>
</head>
<body>
  
  <div class="bg-glow"></div>
  <div class="particles" id="particles"></div>
  <div class="math-symbols" id="mathSymbols"></div>
  
  <nav class="navbar">
    <div class="nav-content">
      <div class="logo">ریاضی نهم</div>
      <ul class="nav-links">
        <li><a href="#" onclick="goHome()">خانه</a></li>
      </ul>
    </div>
  </nav>
  
  <div class="screen active" id="screen-home">
    <div class="container">
      <h1 class="hero-title">تست ریاضی نهم</h1>
      <p class="hero-sub">۸ فصل کتاب — تست‌های المپیادی و چالشی</p>
      
      <div class="stats-row">
        <div class="stat-card">
          <span class="stat-num">۸</span>
          <span class="stat-lbl">فصل کتاب</span>
        </div>
        <div class="stat-card">
          <span class="stat-num" id="totalQuestions">۰</span>
          <span class="stat-lbl">سوال موجود</span>
        </div>
        <div class="stat-card">
          <span class="stat-num" id="totalAttempts">۰</span>
          <span class="stat-lbl">تلاش‌های تو</span>
        </div>
      </div>
      
      <span class="section-label">CHAPTERS</span>
      <h2 class="section-title">فصل‌ها</h2>
      
      <div class="chapters-grid" id="chaptersGrid"></div>
      
      <button class="btn btn-primary btn-all" onclick="startAllQuiz()">
        🎯 آزمون جامع (همه فصل‌ها)
      </button>
    </div>
  </div>
  
  <div class="screen" id="screen-quiz">
    <div class="container">
      <div class="quiz-header">
        <div class="quiz-info">
          <div class="quiz-info-item">
            <span class="quiz-info-label">فصل</span>
            <span class="quiz-info-value" id="quizChapter">—</span>
          </div>
          <div class="quiz-info-item">
            <span class="quiz-info-label">سوال</span>
            <span class="quiz-info-value" id="quizProgress">۱ از ۱۰</span>
          </div>
        </div>
        <div class="timer-box" id="timerBox">
          <span>⏱️</span>
          <span id="timer">۰۰:۰۰</span>
        </div>
      </div>
      
      <div class="progress-wrap">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      
      <div class="question-card" id="questionCard">
        <span class="q-num" id="qNum">سوال ۱</span>
        <div class="q-text" id="qText"></div>
        <div class="options" id="options"></div>
        <div class="explain-box" id="explainBox"></div>
        <div class="next-wrap" id="nextWrap" style="display:none;">
          <button class="btn btn-primary" onclick="nextQuestion()">
            سوال بعدی ←
          </button>
        </div>
      </div>
    </div>
  </div>
  
  <div class="screen" id="screen-result">
    <div class="container">
      <div class="result-card">
        <span class="result-emoji" id="resultEmoji">🏆</span>
        <h2 class="result-title" id="resultTitle">نتیجه آزمون</h2>
        <span class="result-percent" id="resultPercent">۰٪</span>
        
        <div class="result-stats">
          <div class="result-stat">
            <span class="result-stat-num green" id="correctCount">۰</span>
            <span class="result-stat-lbl">درست</span>
          </div>
          <div class="result-stat">
            <span class="result-stat-num red" id="wrongCount">۰</span>
            <span class="result-stat-lbl">غلط</span>
          </div>
          <div class="result-stat">
            <span class="result-stat-num gold" id="timeUsed">۰۰:۰۰</span>
            <span class="result-stat-lbl">زمان</span>
          </div>
        </div>
        
        <div class="result-buttons">
          <button class="btn btn-primary" onclick="retryQuiz()">🔄 دوباره</button>
          <button class="btn btn-secondary" onclick="showReview()">📋 مرور اشتباهات</button>
          <button class="btn btn-secondary" onclick="goHome()">🏠 خانه</button>
        </div>
      </div>
    </div>
  </div>
  
  <div class="screen" id="screen-review">
    <div class="container">
      <span class="section-label">REVIEW</span>
      <h2 class="section-title">مرور اشتباهات</h2>
      <div id="reviewList"></div>
      <div style="margin-top: 30px; text-align: center;">
        <button class="btn btn-secondary" onclick="goHome()">🏠 بازگشت به خانه</button>
      </div>
    </div>
  </div>
  
  <script src="questions.js"></script>
  <script>
    // ═══════════════════════════════════════════════
    // 🧠 منطق سایت
    // ═══════════════════════════════════════════════
    
    let currentQuiz = {
      questions: [],
      currentIndex: 0,
      correct: 0,
      wrong: 0,
      wrongList: [],
      startTime: null,
      timerInterval: null,
      chapterName: ''
    };
    
    // ===== Shuffle (فیشر-یتس) =====
    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }
    
    // ===== Shuffle سوال + گزینه‌ها =====
    function shuffleQuestion(q) {
      const indexed = q.options.map((opt, i) => ({ opt, i }));
      const shuffled = shuffle(indexed);
      const newOptions = shuffled.map(x => x.opt);
      const newAnswer = shuffled.findIndex(x => x.i === q.answer);
      return { q: q.q, options: newOptions, answer: newAnswer, explain: q.explain };
    }
    
    // ===== تبدیل عدد به فارسی =====
    function toFa(num) {
      return num.toString().replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);
    }
    
    // ===== مدیریت تلاش‌ها (localStorage) =====
    function getAttempts() {
      return parseInt(localStorage.getItem('riazi9_attempts') || '0');
    }
    
    function addAttempt() {
      const current = getAttempts();
      localStorage.setItem('riazi9_attempts', (current + 1).toString());
      updateAttemptsDisplay();
    }
    
    function updateAttemptsDisplay() {
      const el = document.getElementById('totalAttempts');
      if (el) el.textContent = toFa(getAttempts());
    }
    
    // ===== نمایش صفحه =====
    function showScreen(id) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(id).classList.add('active');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
    
    // ===== ساخت کارت فصل‌ها =====
    function renderChapters() {
      const grid = document.getElementById('chaptersGrid');
      grid.innerHTML = '';
      let total = 0;
      
      chapters.forEach(ch => {
        total += ch.questions.length;
        const card = document.createElement('div');
        card.className = 'chapter-card';
        card.onclick = () => startQuiz(ch.id);
        card.innerHTML = `
          <div class="chapter-num">فصل ${toFa(ch.id)}</div>
          <div class="chapter-name">${ch.name}</div>
          <div class="chapter-info">
            <span>${toFa(ch.questions.length)} سوال</span>
            <span class="q-count">شروع ←</span>
          </div>
        `;
        grid.appendChild(card);
      });
      
      document.getElementById('totalQuestions').textContent = toFa(total);
      updateAttemptsDisplay();
    }
    
    // ===== شروع آزمون یک فصل =====
    function startQuiz(chapterId) {
      const ch = chapters.find(c => c.id === chapterId);
      if (!ch) return;
      
      const shuffled = shuffle(ch.questions).map(shuffleQuestion);
      
      currentQuiz.questions = shuffled;
      currentQuiz.chapterName = `فصل ${toFa(ch.id)} - ${ch.name}`;
      resetQuizState();
      addAttempt();
      showScreen('screen-quiz');
      renderQuestion();
      startTimer();
    }
    
    // ===== شروع آزمون جامع =====
    function startAllQuiz() {
      let all = [];
      chapters.forEach(ch => {
        ch.questions.forEach(q => all.push(q));
      });
      all = shuffle(all).slice(0, 20).map(shuffleQuestion);
      
      currentQuiz.questions = all;
      currentQuiz.chapterName = 'آزمون جامع';
      resetQuizState();
      addAttempt();
      showScreen('screen-quiz');
      renderQuestion();
      startTimer();
    }
    
    // ===== ریست =====
    function resetQuizState() {
      currentQuiz.currentIndex = 0;
      currentQuiz.correct = 0;
      currentQuiz.wrong = 0;
      currentQuiz.wrongList = [];
      currentQuiz.startTime = Date.now();
      if (currentQuiz.timerInterval) clearInterval(currentQuiz.timerInterval);
    }
    
    // ===== تایمر =====
    function startTimer() {
      const timerEl = document.getElementById('timer');
      const box = document.getElementById('timerBox');
      box.classList.remove('warning');
      
      currentQuiz.timerInterval = setInterval(() => {
        const elapsed = Math.floor((Date.now() - currentQuiz.startTime) / 1000);
        const min = Math.floor(elapsed / 60);
        const sec = elapsed % 60;
        timerEl.textContent = `${toFa(String(min).padStart(2,'0'))}:${toFa(String(sec).padStart(2,'0'))}`;
        
        if (elapsed >= 300) box.classList.add('warning');
      }, 1000);
    }
    
    // ===== نمایش سوال =====
    function renderQuestion() {
      const q = currentQuiz.questions[currentQuiz.currentIndex];
      const total = currentQuiz.questions.length;
      const idx = currentQuiz.currentIndex;
      
      document.getElementById('quizChapter').textContent = currentQuiz.chapterName;
      document.getElementById('quizProgress').textContent = `${toFa(idx+1)} از ${toFa(total)}`;
      document.getElementById('qNum').textContent = `سوال ${toFa(idx+1)}`;
      document.getElementById('qText').textContent = q.q;
      
      const progress = ((idx) / total) * 100;
      document.getElementById('progressFill').style.width = progress + '%';
      
      const optionsEl = document.getElementById('options');
      optionsEl.innerHTML = '';
      
      const letters = ['الف', 'ب', 'ج', 'د'];
      
      q.options.forEach((opt, i) => {
        const div = document.createElement('div');
        div.className = 'option';
        div.innerHTML = `<span class="option-letter">${letters[i]}</span><span>${opt}</span>`;
        div.onclick = () => selectAnswer(i, div);
        optionsEl.appendChild(div);
      });
      
      document.getElementById('explainBox').classList.remove('show');
      document.getElementById('nextWrap').style.display = 'none';
    }
    
    // ===== انتخاب جواب =====
    function selectAnswer(selected, el) {
      const q = currentQuiz.questions[currentQuiz.currentIndex];
      const options = document.querySelectorAll('.option');
      
      options.forEach(o => o.classList.add('disabled'));
      
      options.forEach((o, i) => {
        if (i === q.answer) o.classList.add('correct');
        if (i === selected && i !== q.answer) o.classList.add('wrong');
      });
      
      if (selected === q.answer) {
        currentQuiz.correct++;
      } else {
        currentQuiz.wrong++;
        currentQuiz.wrongList.push({
          q: q.q,
          correct: q.options[q.answer],
          wrong: q.options[selected],
          explain: q.explain
        });
      }
      
      const expBox = document.getElementById('explainBox');
      expBox.innerHTML = `<strong>توضیح:</strong> ${q.explain}`;
      expBox.classList.add('show');
      
      document.getElementById('nextWrap').style.display = 'flex';
    }
    
    // ===== سوال بعدی =====
    function nextQuestion() {
      currentQuiz.currentIndex++;
      if (currentQuiz.currentIndex >= currentQuiz.questions.length) {
        finishQuiz();
      } else {
        renderQuestion();
      }
    }
    
    // ===== پایان آزمون =====
    function finishQuiz() {
      clearInterval(currentQuiz.timerInterval);
      const total = currentQuiz.questions.length;
      const percent = Math.round((currentQuiz.correct / total) * 100);
      const elapsed = Math.floor((Date.now() - currentQuiz.startTime) / 1000);
      const min = Math.floor(elapsed / 60);
      const sec = elapsed % 60;
      
      document.getElementById('resultPercent').textContent = toFa(percent) + '٪';
      document.getElementById('correctCount').textContent = toFa(currentQuiz.correct);
      document.getElementById('wrongCount').textContent = toFa(currentQuiz.wrong);
      document.getElementById('timeUsed').textContent = `${toFa(String(min).padStart(2,'0'))}:${toFa(String(sec).padStart(2,'0'))}`;
      
      let emoji = '😐', title = 'باز هم تلاش کن!';
      if (percent >= 90) { emoji = '🏆'; title = 'فوق‌العاده بود!'; }
      else if (percent >= 75) { emoji = '🎉'; title = 'عالی بود!'; }
      else if (percent >= 50) { emoji = '👍'; title = 'خوب بود!'; }
      else if (percent >= 30) { emoji = '💪'; title = 'باز هم تلاش کن!'; }
      else { emoji = '📚'; title = 'نیاز به مطالعه بیشتر'; }
      
      document.getElementById('resultEmoji').textContent = emoji;
      document.getElementById('resultTitle').textContent = title;
      
      showScreen('screen-result');
    }
    
    // ===== مرور اشتباهات =====
    function showReview() {
      const list = document.getElementById('reviewList');
      list.innerHTML = '';
      
      if (currentQuiz.wrongList.length === 0) {
        list.innerHTML = '<div class="no-mistakes">🎉 هیچ اشتباهی نداشتی! عالی بودی!</div>';
      } else {
        currentQuiz.wrongList.forEach(item => {
          const div = document.createElement('div');
          div.className = 'review-item';
          div.innerHTML = `
            <div class="review-q">${item.q}</div>
            <div class="review-answer">
              <span class="label">جواب تو:</span>
              <span class="wrong-val">${item.wrong}</span>
            </div>
            <div class="review-answer">
              <span class="label">جواب درست:</span>
              <span class="correct-val">${item.correct}</span>
            </div>
            <div class="review-answer" style="margin-top:10px;">
              <span class="label">توضیح:</span>
              <span style="color:#ccc;">${item.explain}</span>
            </div>
          `;
          list.appendChild(div);
        });
      }
      
      showScreen('screen-review');
    }
    
    // ===== دوباره =====
    function retryQuiz() {
      const shuffled = shuffle(currentQuiz.questions).map(shuffleQuestion);
      currentQuiz.questions = shuffled;
      resetQuizState();
      addAttempt();
      showScreen('screen-quiz');
      renderQuestion();
      startTimer();
    }
    
    // ===== خانه =====
    function goHome() {
      if (currentQuiz.timerInterval) clearInterval(currentQuiz.timerInterval);
      showScreen('screen-home');
    }
    
    // ===== ذرات =====
    function createParticles() {
      const container = document.getElementById('particles');
      for (let i = 0; i < 35; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        p.style.left = Math.random() * 100 + '%';
        p.style.animationDuration = (10 + Math.random() * 15) + 's';
        p.style.animationDelay = Math.random() * 12 + 's';
        p.style.width = (1 + Math.random() * 2) + 'px';
        p.style.height = p.style.width;
        container.appendChild(p);
      }
    }
    
    // ===== اعداد ریاضی سه‌بعدی =====
    function createMathSymbols() {
      const container = document.getElementById('mathSymbols');
      const symbols = ['π', '√', 'Σ', '∞', '∫', 'Δ', 'θ', '≠', '±', '≈', '۱', '۲', '۳', '۴', '۵', '۶', '۷', '۸', '۹', 'x²', '√x', 'a²', 'πr²', 'Σn'];
      
      for (let i = 0; i < 20; i++) {
        const span = document.createElement('span');
        span.className = 'math-symbol';
        span.textContent = symbols[Math.floor(Math.random() * symbols.length)];
        span.style.left = Math.random() * 100 + '%';
        span.style.animationDuration = (15 + Math.random() * 20) + 's';
        span.style.animationDelay = Math.random() * 15 + 's';
        span.style.fontSize = (2 + Math.random() * 2.5) + 'rem';
        container.appendChild(span);
      }
    }
    
    // ===== شروع =====
    createParticles();
    createMathSymbols();
    renderChapters();
  </script>
</body>
</html>
